# Build sheet example: survivors going against The Trapper
# Run from the repo root:
#   node utilities/build-sheet-generator/build-sheet-generator.js \
#        utilities/build-sheet-generator/examples/the-trapper-survivors.yaml \
#        --out utilities/build-sheet-generator/output
#
# Add --rules to flag illegal picks against an existing allow-list (they stay
# in the sheet, just outlined in red):
#   node utilities/build-sheet-generator/build-sheet-generator.js \
#        utilities/build-sheet-generator/examples/the-trapper-survivors.yaml \
#        --out utilities/build-sheet-generator/output \
#        --rules sheetdata/examples/the-trapper.yaml

killer: The Trapper           # OPTIONAL; drives the "Going against:" header + portrait
balancing: DBDLeague

survivors:                    # 1-4 rows, one loadout per survivor

  # Row 1: a clean, fully legal build — the baseline row, with no --rules
  # violations, so the sheet isn't wall-to-wall red.
  - perks: [Sprint Burst, Windows of Opportunity, Prove Thyself, Resilience]
    item: Sport Flashlight    # an Items.json VARIANT name; the only item allowed by
                               # sheetdata/examples/the-trapper.yaml's items: block
    addons: [Wide Lens, Power Bulb]   # both Common rarity -> legal under that file's
                                      # items.Flashlight.addons allow-list
    offering: Shroud of Union         # from Offerings.json Survivor[]

  # Row 2: only 2 perks -> exercises the blank perk slot; only 1 add-on ->
  # exercises the blank add-on slot; no offering -> exercises the blank
  # offering slot. Also plants a survivorPerks.deny and an items violation.
  - perks:
      - Empathy         # NOT on the survivorPerks allow-list (default: deny) -> flagged
      - Bond
    item: First Aid Kit          # a Med-Kit variant; items.Med-Kit.default is deny -> flagged
    addons: [Rubber Gloves]      # only 1 -> 1 blank add-on slot (moot: item itself is denied)
    # no offering -> blank offering slot

  # Row 3: no item -> exercises the blank item slot (and, since item is absent,
  # both add-on slots are blank too). Also plants a survivorComboBans.survivor
  # violation: each perk below is individually allowed, but this pair is banned
  # together for one player.
  - perks:
      - Prove Thyself      # individually allowed...
      - Botany Knowledge   # ...but this pair is banned by survivorComboBans.survivor
      - Self-Care
      - Inner Strength
    # no item -> blank item slot, and addons would be a hard error without one
    offering: Vigo's Shroud

  # Row 4: a full, otherwise-legal perk build, but the item add-on is above
  # Common rarity -> plants an items.Flashlight.addons violation while the item
  # itself (Sport Flashlight) stays legal.
  - perks: [Windows of Opportunity, Resilience, Adrenaline, Solidarity]
    item: Sport Flashlight
    addons: [Intense Halogen]   # Rare rarity -> NOT covered by the Common-only allow-list
    offering: Chalk Pouch

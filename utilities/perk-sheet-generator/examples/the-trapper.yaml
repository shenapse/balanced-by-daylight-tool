# Perk allow-list example: The Trapper
# Run from the repo root:
#   node utilities/perk-sheet-generator/perk-sheet-generator.js \
#        utilities/perk-sheet-generator/examples/the-trapper.yaml \
#        --out utilities/perk-sheet-generator/output \
#        --preset utilities/perk-sheet-generator/output/test-preset.json

killer: The Trapper

# Optional label identifying which balancing ruleset these allow-lists come from.
# Shown on both generated sheets and stored in the --preset JSON.
balancing: DBDLeague

# universe is optional; defaults to every perk in dbdperks.json for each side.
# universe:
#   killer: all
#   survivor: all

killerPerks:
  default: allow         # Start with all killer perks allowed
  deny:                  # Then deny these specific perks
    - Bamboozle          # The Clown perk (by name)
    - Dead Man's Switch  # DMS - too oppressive
    - Starstruck         # The Trickster perk
    - "Scourge Hook: Monstrous Shrine"   # names with a colon MUST be quoted in YAML
  allow: []              # No exceptions needed (allow wins over deny if listed in both)

survivorPerks:
  default: deny          # Start with no survivor perks allowed
  allow:                 # Then allow these specific perks and groups
    - Borrowed Time      # BT
    - Sprint Burst       # SB
    - Lithe              # exhaustion perk (for the pick-limit example below)
    - Balanced Landing   # exhaustion perk (for the pick-limit example below)
    - Unbreakable        # UB
    - Adrenaline
    - Bond
    - Kindred
    - Windows of Opportunity
    - Prove Thyself
    - We'll Make It
    - Botany Knowledge
    - Self-Care
    - Inner Strength
    - Resilience
    - Solidarity
    - { exhaustion: true }  # Group selector: every exhaustion perk (Sprint Burst is covered but adding the group catches future ones)
  deny: []

# Combination bans (image-only — rendered on the sheets, NOT written to --preset).
# Each perk stays individually allowed; only the listed pairings are restricted.
# Grouped by scope, in increasing strictness:
#   survivor — one player may not bring both perks
#   duo      — neither duo may bring both perks between its two members
#   team     — if one survivor brings one perk, no other survivor may bring the other
survivorComboBans:
  survivor:
    - [Prove Thyself, Botany Knowledge]   # one player can't stack both repair boosts
  duo:
    - [Bond, Kindred]                     # duo partners can't double up on aura reading
  team:
    - [Adrenaline, Sprint Burst]          # only one exhaustion-heal across the team

# Killer combos apply to the killer's own 4-perk build (single implicit scope).
killerComboBans:
  - ["Scourge Hook: Pain Resonance", Pop Goes the Weasel]

# Repetition limits (image-only — rendered on the survivor sheet, NOT written to
# --preset). A limit caps how many members of a scoped group may each bring the SAME
# perk (unlike a combo ban, which restricts a set of DIFFERENT perks together).
# Survivor side only; scopes are duo and team.
#   scope: duo | team
#   max:   positive integer — at most this many members may bring any covered perk
#   perks: "all" (or omitted) → every allowed perk; or a list → only those perks
survivorRepetitionLimits:
  - scope: duo
    max: 1                 # duo partners may not double up on any perk
    perks: all
  - scope: team
    max: 2                 # each listed perk may be brought by at most 2 survivors
    perks:
      - Self-Care
      - Botany Knowledge

# Pick limits (image-only — rendered on the sheets, NOT written to --preset).
# "Pick at most N perks from this list." A group may bring at most `max` perks drawn
# from `perks` in total. If `max` equals (list length - 1) the limit reduces to a
# combination ban ("not all of them together") and is rendered under Combination Bans
# instead; if `max` is at least the list length it is vacuous and dropped.
#   scope: survivor | duo | team   (killerPickLimits take no scope — the killer's build)
#   max:   positive integer
#   perks: a list of 2+ perk names to choose from
survivorPickLimits:
  - scope: duo
    max: 1                 # a duo may bring at most one of these exhaustion perks
    perks:
      - Sprint Burst
      - Lithe
      - Balanced Landing

# Killer pick limits apply to the killer's own 4-perk build (single implicit scope).
killerPickLimits:
  - max: 2                 # at most two of these gen-slowdown perks in one build
    perks:
      - Pop Goes the Weasel
      - Corrupt Intervention
      - Overcharge
      - Eruption
